name: Rebuild Jargon direction preview
on:
  push:
    branches:
      - fix/compact-mobile-board-width
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate self-contained index.html
        run: python tools/build.py
      - name: Commit deterministic compiled game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate direction-aware game [skip ci]"
            git push origin HEAD:fix/compact-mobile-board-width
          fi
