name: Jargon alpha checks
on:
  pull_request:
  push:
    branches: [main, feature/explicit-word-direction, feature/tile-drag-to-board, feature/drag-qa-cursor, feature/mobile-turn-flow-qa, feature/offline-bot-engine, feature/rack-drag-reorder-recall]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up browser tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Rebuild standalone game
        run: python tools/build.py
      - name: Ensure release build was committed
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: git diff --exit-code -- index.html
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from re import search, S
          source=Path('index.html').read_text()
          Path('check.js').write_text(search(r'<script>(.*?)</script>',source,S).group(1))
          PY
          node --check check.js
      - name: Browser regressions
        run: python tests/regression.py

      - name: Workshop visual, layout, reduced-motion checks
        run: python tests/workshop_visual.py

      - name: ENABLE2K dictionary and legacy compatibility
        run: python tests/dictionary_smoke.py
      - name: Self-hosted Fraunces and mobile screenshots
        run: python tests/typography_smoke.py
      - name: Archive Jargon screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jargon-pr9-typography-screenshots
          path: artifacts/typography/*.png
          if-no-files-found: warn

      - name: Tactile action effects and reduced-motion behavior
        run: python tests/tactile_smoke.py

      - name: Mobile draft preview and safe auto-placement
        run: python tests/mobile_draft_smoke.py

      - name: Direction cursor and crosswords
        run: python tests/drag_direction_smoke.py

      - name: Offline bot engine legality and determinism
        run: node tests/bot.test.cjs

      - name: Private multiplayer protocol security and concurrency smoke
        run: node tests/online_protocol.test.cjs

      - name: Private friend invitation client transport
        run: node tests/online_client.test.cjs

      - name: Build and check Cloudflare match Worker syntax
        run: |
          python online/build.py
          node --check online/dist/worker.mjs

      - name: Offline opponent browser end-to-end
        run: python tests/bot_ui_smoke.py

      - name: Rack drag reorder and precision recall
        run: python tests/rack_reorder_smoke.py

      - name: Familiar keyboard entry and precise tile drag
        run: python tests/familiar_controls_smoke.py
