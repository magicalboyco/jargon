name: Jargon alpha checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up browser tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Rebuild standalone game
        run: python tools/build.py
      - name: Ensure generated build was committed
        run: git diff --exit-code -- index.html
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from re import search, S
          source=Path('index.html').read_text()
          Path('check.js').write_text(search(r'<script>(.*?)</script>',source,S).group(1))
          PY
          node --check check.js
      - name: Browser regressions
        run: python tests/regression.py

      - name: Workshop visual, layout, reduced-motion checks
        run: python tests/workshop_visual.py

      - name: ENABLE2K dictionary and legacy compatibility
        run: python tests/dictionary_smoke.py
      - name: Self-hosted Fraunces and mobile screenshots
        run: python tests/typography_smoke.py
      - name: Archive Jargon screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jargon-pr9-typography-screenshots
          path: artifacts/typography/*.png
          if-no-files-found: warn

      - name: Physical-feel interaction and privacy regressions
        run: python tests/kinetic_workshop.py
      - name: Archive PR13 visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jargon-pr13-kinetic-mobile
          path: artifacts/kinetic-pr13/*.png
          if-no-files-found: warn
